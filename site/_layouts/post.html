---
layout: default
---
<link rel="stylesheet" href="{{ 'styles/blog.css' | relative_url }}">
<div class="goback">
    <a href="{{ 'pages/blog' | relative_url }}">
        <span class="goback-icon"></span>
        <p style="display: inline;">go back</p>
    </a>
</div>
<h1>{{ page.title }}</h1>
<div class="tag-list">
    Tags:
    {% for tag in site.tags %}
    <a><p style="display: inline; padding: 3px; background-color: var(--accent); color: #323232; border-radius: 5px">{{ tag[0] }}</p></a>
    {% endfor %}
</div>
<br>
{{ content }}
