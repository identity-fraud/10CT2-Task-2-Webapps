<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>{{ page.title }} - website name</title>
        <link rel="stylesheet" href="{{ 'styles/style.css' | relative_url }}"> <!-- relative urls because nested file -->
        <link rel="icon" type="image/x-icon" href="{{ 'assets/favicon.ico' | relative_url }}">
        <script> 
            const savedScheme = localStorage.getItem('color-scheme');
			if (savedScheme) {document.documentElement.style.colorScheme = savedScheme;}
        </script> <!-- save current colour scheme to localstorage -->
    </head>
    <body>
        <header>
            <h4><a href="{{ 'index.html' | relative_url }}">website name</a></h4>
            <nav>
                <h4><a href="https://github.com/identity-fraud/10CT2-Task-2-Webapps">Github</a></h4>
                <h4>|</h4>
                <h4><a href="{{ 'pages/blog.html' | relative_url }}">Blog</a></h4>
                <h4>|</h4>
                <button id="theme-toggle">
                    <span class="theme-icon"></span>
                </button>
            </nav>
        </header>
        <main>
            {{ content }} <!-- main content from liquid -->
        </main>
        <footer>
            <hr>
            <p>© identity-fraud. All Rights Reserved. Certain icons from Bootstrap. Hosted with Github Pages</p>
        </footer>
    <script src="{{ 'scripts/script.js' | relative_url }}"></script> <!-- tag is at the bottom, makes it the same as the defer tag -->
    </body>
</html>
