---
layout: default
---

<link rel="stylesheet" href="{{ 'styles/post.css' | relative_url }}">
<div class="goback">
    <a href="{{ 'pages/blog' | relative_url }}">
        <span class="goback-icon"></span>
        <p style="display: inline;">go back</p>
    </a>
</div>
<h1>{{ page.title }}</h1>

<div class="tag-list">
    Tags:
    {% for tag in page.tags %}
        <a href="{{ 'pages/blog' | relative_url }}?q={{ tag | url_encode }}">
            <span class="tags">{{ tag }}</span>
        </a>
    {% endfor %}
</div>
<br>
{{ content }}
